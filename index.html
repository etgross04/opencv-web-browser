<!DOCTYPE html>
<html>
<head>
    <title>OpenCV.js Demo</title>
    <script async src="opencv.js/build/asm.js/opencv.js" type="text/javascript"></script>
</head>
<body>
    <h1>OpenCV.js Demo</h1>
    <p id="status">Loading OpenCV.js...</p>
    
    <div class="container">
      <div>
        <label for="blurSlider">Blur Intensity: </label>
        <input type="range" id="blurSlider" min="1" max="49" value="7" step="1">
        <span id="sliderValue">7</span>
      </div>
        <div>
            <h3>Input Video</h3>
            <input type="file" id="videoUpload" accept="video/*,.mov,.mp4,.webm,.avi,.mkv">
            <br><br>
            <video id="videoInput" controls muted style="max-width: 640px; max-height: 480px;"></video>
        </div>
        <div>
            <h3>Output (Gaussian Blur)</h3>
            <canvas id="canvasOutput" width="320" height="240" style="max-width: 640px; max-height: 480px;"></canvas>
        </div>
    </div>
    
    <script type="text/javascript">
        //Homography stuff,
        let opencvReady = false;
        let src = null;
        let dst = null;
        let cap = null;
        const FPS = 30;

        function onOpenCvReady() {
            opencvReady = true;
            document.getElementById('status').innerText = 'OpenCV.js is ready! Upload a video to start.';
        }

        let isProcessing = false;

        function processVideo() {
            let video = document.getElementById('videoInput');
            try {
                if (!video.paused && !video.ended) {
                    let begin = Date.now();

                    cap.read(src);

                    let val = parseInt(document.getElementById('blurSlider').value);
                    let ksizeval = val % 2 === 0 ? val + 1 : val;
                    document.getElementById('sliderValue').innerText = ksizeval;

                    let ksize = new cv.Size(ksizeval, ksizeval);
                    cv.GaussianBlur(src, dst, ksize, 0, 0, cv.BORDER_DEFAULT);

                    cv.imshow('canvasOutput', dst);

                    let delay = 1000 / FPS - (Date.now() - begin);
                    setTimeout(processVideo, Math.max(delay, 0));
                } else {
                    isProcessing = false;
                }
            } catch (err) {
                console.error("OpenCV.js error: ", err);
                document.getElementById('status').innerText = 'Error: ' + err.message;
                isProcessing = false;
            }
        }

        function startProcessing(video) {
            if (!opencvReady) {
                document.getElementById('status').innerText = 'OpenCV.js not ready yet. Please wait...';
                video.pause();
                return;
            }

            if (video.videoWidth === 0 || video.videoHeight === 0) {
                document.getElementById('status').innerText = 'Error: Video dimensions not available';
                return;
            }

            // Clean up previous OpenCV objects if they exist
            if (src) { src.delete(); src = null; }
            if (dst) { dst.delete(); dst = null; }
            
            // Resize canvas to match video dimensions
            let canvas = document.getElementById('canvasOutput');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Initialize OpenCV objects
            src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            dst = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            cap = new cv.VideoCapture(video);
            
            document.getElementById('status').innerText = 'Processing video...';
            isProcessing = true;
            processVideo();
        }

        // Start processing when the video plays
        document.getElementById('videoInput').addEventListener('play', function() {
            if (!isProcessing) {
                startProcessing(this);
            }
        });

        //Set up video upload immediately
        let video = document.getElementById('videoInput');
        
        // Wait for video metadata to load to get dimensions
        video.addEventListener('loadedmetadata', function() {
            // Set video element size to match actual video dimensions
            this.width = this.videoWidth;
            this.height = this.videoHeight;
            
            document.getElementById('status').innerText = 
                `Video loaded (${this.videoWidth}x${this.videoHeight}). ` + 
                (opencvReady ? 'Click play!' : 'Waiting for OpenCV...');
        });

        document.getElementById('videoUpload').addEventListener('change', (e) => {
            let file = e.target.files[0];
            if (file) {
                let url = URL.createObjectURL(file);
                video.src = url;
                video.load();
                document.getElementById('status').innerText = 'Loading video...';
            }
        });

        // Wait for OpenCV.js to be ready
        function waitForOpenCV() {
            let checkReady = setInterval(() => {
                try {
                    if (typeof cv !== 'undefined' && cv.Mat) {
                        clearInterval(checkReady);
                        onOpenCvReady();
                    }
                } catch (e) {
                    // cv exists but not ready yet
                }
            }, 100);
            
            // Timeout after 30 seconds
            setTimeout(() => {
                clearInterval(checkReady);
                if (typeof cv === 'undefined' || !cv.Mat) {
                    document.getElementById('status').innerText = 'Failed to load OpenCV.js. Check browser console for errors.';
                    console.error('OpenCV.js failed to load. Make sure you are running a local server (not file://)');
                }
            }, 30000);
        }
        waitForOpenCV();
    </script>
</body>
</html>
